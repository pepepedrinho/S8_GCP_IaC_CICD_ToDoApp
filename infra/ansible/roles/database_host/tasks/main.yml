---
- name: Configure Ubuntu package access through application host
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80todo-relay
    mode: '0644'
    content: |
      Acquire::http::Proxy "http://{{ todo_app_private_ip }}:3128";
      Acquire::https::Proxy "http://{{ todo_app_private_ip }}:3128";
- name: Install Docker on private host
  ansible.builtin.apt:
    name: [docker.io, docker-compose-v2]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
- name: Inspect persistent disk filesystem
  ansible.builtin.command: blkid -s TYPE -o value /dev/disk/by-id/google-todo-mongo-data
  register: database_host_disk_type
  changed_when: false
  failed_when: database_host_disk_type.rc not in [0, 2]
- name: Refuse unexpected filesystems
  ansible.builtin.assert:
    that: database_host_disk_type.rc == 2 or database_host_disk_type.stdout == 'ext4'
- name: Format only a new unformatted disk
  ansible.builtin.command: mkfs.ext4 -m 0 /dev/disk/by-id/google-todo-mongo-data
  when: database_host_disk_type.rc == 2
  changed_when: true
- name: Create persistent mount point
  ansible.builtin.file:
    path: /srv/todo-data
    state: directory
    mode: '0755'
- name: Keep data disk mounted across restarts
  ansible.posix.mount:
    src: /dev/disk/by-id/google-todo-mongo-data
    path: /srv/todo-data
    fstype: ext4
    opts: defaults,nofail
    state: mounted
- name: Create database directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0700'
  loop: ["{{ todo_root }}", "{{ todo_root }}/secrets", "{{ todo_root }}/bin", "{{ todo_root }}/backups", /srv/todo-data/mongo]
- name: Assign data directory to Mongo user
  ansible.builtin.file:
    path: /srv/todo-data/mongo
    owner: '999'
    group: '999'
    mode: '0700'
- name: Transfer Mongo image over SSH
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../.local/artifacts/mongo.tar.gz"
    dest: "{{ todo_root }}/mongo.tar.gz"
    mode: '0600'
  register: database_host_mongo_archive
- name: Import Mongo image without registry access # noqa: no-handler
  ansible.builtin.command: "docker load -i {{ todo_root }}/mongo.tar.gz"
  when: database_host_mongo_archive.changed
  changed_when: true
- name: Install protected Mongo credentials
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "{{ todo_root }}/secrets/{{ item.name }}"
    owner: '999'
    group: '999'
    mode: '0400'
  no_log: true
  loop:
    - {name: mongo_root_password, value: "{{ mongo_root_password }}"}
    - {name: mongo_app_password, value: "{{ mongo_app_password }}"}
- name: Install database initialization script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../banco-de-dados/{{ item }}"
    dest: "{{ todo_root }}/{{ item }}"
    mode: '0444'
  loop: [init-mongo.js, bootstrap-administrator.js, ensure-application-user.js]
- name: Configure database tools without password arguments
  ansible.builtin.copy:
    content: "{{ {'password': mongo_root_password} | to_json }}"
    dest: "{{ todo_root }}/secrets/mongo_tools_config"
    owner: '999'
    group: '999'
    mode: '0400'
  no_log: true
- name: Install lightweight final-daemon health probe
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../banco-de-dados/healthcheck.sh"
    dest: "{{ todo_root }}/healthcheck.sh"
    mode: '0444'
- name: Install database Compose definition
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ todo_root }}/compose.yml"
    mode: '0600'
- name: Start authenticated database
  ansible.builtin.command: docker compose -f /opt/todo/compose.yml up -d --wait --wait-timeout 300
  register: database_host_up
  changed_when: "'Started' in database_host_up.stderr or 'Created' in database_host_up.stderr or 'Recreated' in database_host_up.stderr"
- name: Check configured administrator authentication
  block:
    - name: Verify administrator with bounded authentication probe
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - /opt/todo/compose.yml
          - exec
          - -T
          - mongo
          - timeout
          - --kill-after=10s
          - 120s
          - mongosh
          - mongodb://127.0.0.1:27017/admin?serverSelectionTimeoutMS=10000
          - --quiet
          - --norc
          - --eval
          - |
            try {
              const fs = require('fs');
              const password = fs.readFileSync(
                '/run/secrets/mongo_root_password', 'utf8'
              ).trim();
              db.auth('administrator', password);
              const status = db.runCommand({connectionStatus: 1});
              const authenticated = status.authInfo.authenticatedUsers.some(
                u => u.user === 'administrator' && u.db === 'admin'
              );
              if (!authenticated) quit(43);
              print('ADMIN_AUTH_OK');
              quit(0);
            } catch (e) {
              if (e.code === 18 || e.codeName === 'AuthenticationFailed') {
                print('ADMIN_AUTH_REJECTED');
                quit(42);
              }
              print('ADMIN_PROBE_ERROR');
              quit(43);
            }
      no_log: true
      register: database_host_administrator
      changed_when: false
      failed_when: >-
        not (
          (database_host_administrator.rc == 0 and
           'ADMIN_AUTH_OK' in database_host_administrator.stdout)
          or
          (database_host_administrator.rc == 42 and
           'ADMIN_AUTH_REJECTED' in database_host_administrator.stdout)
        )
      until: >-
        (database_host_administrator.rc == 0 and
         'ADMIN_AUTH_OK' in database_host_administrator.stdout)
        or
        (database_host_administrator.rc == 42 and
         'ADMIN_AUTH_REJECTED' in database_host_administrator.stdout)
      retries: 2
      delay: 10
  rescue:
    - name: Abort on unexpected administrator probe failure
      ansible.builtin.fail:
        msg: >-
          Mongo administrator probe failed with exit code
          {{ database_host_administrator.rc | default('unknown') }}.
          Bootstrap refused because authentication rejection was not confirmed.
- name: Complete interrupted first-user bootstrap through localhost exception
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - /opt/todo/compose.yml
      - exec
      - -T
      - mongo
      - timeout
      - --kill-after=10s
      - 120s
      - mongosh
      - mongodb://127.0.0.1:27017/admin?serverSelectionTimeoutMS=10000
      - --quiet
      - --norc
      - /run/todo/bootstrap-administrator.js
  no_log: true
  when: >-
    database_host_administrator.rc == 42 and
    'ADMIN_AUTH_REJECTED' in database_host_administrator.stdout
  changed_when: true
- name: Ensure application user after interrupted first initialization
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - /opt/todo/compose.yml
      - exec
      - -T
      - mongo
      - timeout
      - --kill-after=10s
      - 120s
      - mongosh
      - mongodb://127.0.0.1:27017/admin?serverSelectionTimeoutMS=10000
      - --quiet
      - --norc
      - /run/todo/ensure-application-user.js
  no_log: true
  register: database_host_application_user
  changed_when: "'created' in database_host_application_user.stdout"
- name: Install operations scripts
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../scripts/{{ item }}"
    dest: "{{ todo_root }}/bin/{{ item }}"
    mode: '0700'
  loop: [backup.sh, restore-isolated.sh, verify-backup.py, gcs.py]
- name: Configure backup storage
  ansible.builtin.copy:
    dest: "{{ todo_root }}/backup.env"
    mode: '0600'
    content: |
      BACKUP_BUCKET={{ todo_backup_bucket }}
      TODO_ROOT={{ todo_root }}
- name: Install backup service
  ansible.builtin.copy:
    src: todo-backup.service
    dest: /etc/systemd/system/todo-backup.service
    mode: '0644'
- name: Install persistent backup timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/todo-backup.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Daily Mongo backup while host is available
      [Timer]
      OnCalendar=*-*-* 03:00:00
      Persistent=true
      RandomizedDelaySec=120
      [Install]
      WantedBy=timers.target
- name: Enable backup timer
  ansible.builtin.systemd_service:
    name: todo-backup.timer
    state: started
    enabled: true
    daemon_reload: true
