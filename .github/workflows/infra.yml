name: Infrastructure
on:
  push:
    branches: [feat/infra-terraform-ansible-actions]
    paths: [.github/workflows/infra.yml]
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [validate, plan, apply]
        default: validate
      confirmation:
        description: Enter PROVISION to create/start the approved resources
        type: string
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: todo-gcp-mutations
  cancel-in-progress: false
jobs:
  terraform:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Validate without GCP access
        if: inputs.action == 'validate'
        run: |
          terraform fmt -check -recursive infra/terraform
          terraform -chdir=infra/terraform/main init -backend=false -input=false
          terraform -chdir=infra/terraform/main validate
      - uses: google-github-actions/auth@v3
        id: gcp
        if: inputs.action != 'validate'
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Use temporary service-account token
        if: inputs.action != 'validate'
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CLOUDSDK_AUTH_ACCESS_TOKEN=' + os.environ['GCP_ACCESS_TOKEN'] + '\n')
              env.write('GOOGLE_OAUTH_ACCESS_TOKEN=' + os.environ['GCP_ACCESS_TOKEN'] + '\n')
          PY
      - uses: google-github-actions/setup-gcloud@v3
        if: inputs.action != 'validate'
      - if: inputs.action != 'validate'
        run: |
          terraform -chdir=infra/terraform/main init -input=false -backend-config=bucket=triodelicia-mensal4-2026-todo-state -backend-config=prefix=todo/main
          terraform -chdir=infra/terraform/main plan -input=false -out=tfplan
          terraform -chdir=infra/terraform/main show -json tfplan > .local-plan.json
          python scripts/check-plan.py .local-plan.json
      - if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = PROVISION
          terraform -chdir=infra/terraform/main apply -input=false tfplan
          python scripts/cloud.py status
      - if: failure() && inputs.action == 'apply'
        run: python scripts/cloud.py stop
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: infrastructure-evidence
          path: docs/evidencias/cloud-*.json
          retention-days: 7
