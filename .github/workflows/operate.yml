name: Operate
on:
  push:
    branches: [feat/infra-terraform-ansible-actions]
    paths: [.github/workflows/operate.yml]
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [start, stop, health, logs, diagnose, backup, restore, rollback, acceptance, recovery]
        required: true
      backup_object:
        description: For restore only, todo/todo-YYYYMMDDTHHMMSSZ.archive.gz
        type: string
        required: false
      comparison_commit:
        description: For acceptance only, full SHA of the second already transferred image
        type: string
        required: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: todo-gcp-mutations
  cancel-in-progress: false
jobs:
  operate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.operation == 'acceptance' || inputs.operation == 'recovery') && 40 || 20 }}
    env:
      OPERATION: ${{ inputs.operation }}
      BACKUP_OBJECT: ${{ inputs.backup_object }}
      COMPARISON_COMMIT: ${{ inputs.comparison_commit }}
      ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible/ansible.cfg
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/prepare-evidence.py operate
      - uses: google-github-actions/auth@v3
        id: gcp
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Use temporary service-account token
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CLOUDSDK_AUTH_ACCESS_TOKEN=' + os.environ['GCP_ACCESS_TOKEN'] + '\n')
              env.write('GOOGLE_OAUTH_ACCESS_TOKEN=' + os.environ['GCP_ACCESS_TOKEN'] + '\n')
          PY
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ansible-core==2.19.4
      - name: Execute selected operation
        env:
          DUCKDNS_DOMAIN: ${{ vars.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          case "$OPERATION" in
            start|acceptance|recovery)
              test -n "$DUCKDNS_TOKEN" || { echo "::error::DUCKDNS_TOKEN is missing"; exit 1; }
              if [[ "$OPERATION" == acceptance ]]; then
                [[ "$COMPARISON_COMMIT" =~ ^[a-f0-9]{40}$ ]]
              fi
              python scripts/cloud.py start
              python scripts/cloud.py dns
              ansible-playbook -i .local/inventory.yml infra/ansible/https.yml -e @.local/runtime.json
              if [[ "$OPERATION" == acceptance || "$OPERATION" == recovery ]]; then
                ansible-playbook -i .local/inventory.yml infra/ansible/operations.yml
                ansible-playbook -i .local/inventory.yml infra/ansible/operations.yml | tee .local/operations-second-run.log
                python - <<'PY'
          import json,pathlib,re
          text=pathlib.Path('.local/operations-second-run.log').read_text()
          rows=re.findall(r'(todo-app|todo-db)\s+: ok=(\d+)\s+changed=(\d+)\s+unreachable=(\d+)\s+failed=(\d+)',text)
          assert len(rows)==2 and all(row[2:]==('0','0','0') for row in rows),rows
          result={'passed':True,'cloud_test':True,'playbook':'operations.yml','hosts':{row[0]:dict(zip(('ok','changed','unreachable','failed'),map(int,row[1:]))) for row in rows}}
          pathlib.Path('docs/evidencias/gcp-operations-idempotence.json').write_text(json.dumps(result,indent=2))
          PY
              fi
              ;;
            diagnose) python scripts/cloud.py boot; python scripts/cloud.py logs ;;
            stop|logs|backup|rollback) python scripts/cloud.py "$OPERATION" ;;
            restore) python scripts/cloud.py restore --object "$BACKUP_OBJECT" ;;
            health) python scripts/cloud.py status ;;
            *) exit 2 ;;
          esac
      - name: Verify public readiness and report URL
        if: inputs.operation == 'start' || inputs.operation == 'health' || inputs.operation == 'rollback' || inputs.operation == 'acceptance' || inputs.operation == 'recovery'
        run: |
          python scripts/cloud.py status
          url=$(python -c 'import json; print(json.load(open("docs/evidencias/cloud-status.json"))["url"])')
          python scripts/smoke.py "$url" --evidence docs/evidencias/reactivation-smoke.json
          echo "Application: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate persistence rollback and isolated GCS recovery
        if: inputs.operation == 'acceptance' || inputs.operation == 'recovery'
        run: |
          args=(--comparison-commit "$COMPARISON_COMMIT")
          if [[ "$OPERATION" == recovery ]]; then args+=(--recovery-only); fi
          python scripts/cloud-acceptance.py "${args[@]}"
      - name: Collect diagnostics after acceptance failure
        if: failure() && (inputs.operation == 'acceptance' || inputs.operation == 'recovery')
        run: python scripts/cloud.py logs
      - if: failure() && inputs.operation == 'start'
        run: python scripts/cloud.py stop
      - if: always() && (inputs.operation == 'diagnose' || inputs.operation == 'acceptance' || inputs.operation == 'recovery')
        run: python scripts/cloud.py stop
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operations-evidence
          path: |
            docs/evidencias/operate-context.json
            docs/evidencias/cloud-start.json
            docs/evidencias/cloud-stop.json
            docs/evidencias/cloud-status.json
            docs/evidencias/cloud-boot.json
            docs/evidencias/cloud-dns.json
            docs/evidencias/cloud-logs.json
            docs/evidencias/cloud-diagnostics.json
            docs/evidencias/cloud-backup.json
            docs/evidencias/cloud-restore.json
            docs/evidencias/cloud-rollback.json
            docs/evidencias/reactivation-smoke.json
            docs/evidencias/gcp-acceptance.json
            docs/evidencias/gcp-recovery.json
            docs/evidencias/gcp-operations-idempotence.json
          retention-days: 14
