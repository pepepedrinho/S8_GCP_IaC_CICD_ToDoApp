name: Configure and deploy
on:
  workflow_dispatch:
    inputs:
      image_commit:
        description: Full commit SHA already published by Validate
        type: string
        required: true
      comparison_commit:
        description: Optional second published SHA for real image update and rollback acceptance
        type: string
        required: false
permissions:
  contents: read
  packages: read
  id-token: write
concurrency:
  group: todo-gcp-mutations
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      CERTIFICATE_EMAIL: ${{ secrets.CERTIFICATE_EMAIL }}
      IMAGE_COMMIT: ${{ inputs.image_commit }}
      COMPARISON_COMMIT: ${{ inputs.comparison_commit }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
      MONGO_APP_PASSWORD: ${{ secrets.MONGO_APP_PASSWORD }}
      ANSIBLE_CONFIG: ${{ github.workspace }}/infra/ansible/ansible.cfg
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/prepare-evidence.py deploy
      - uses: google-github-actions/auth@v3
        id: gcp
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 3600s
      - name: Use short-lived service-account token for this job
        env:
          GCP_ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          python - <<'PY'
          import os
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CLOUDSDK_AUTH_ACCESS_TOKEN=' + os.environ['GCP_ACCESS_TOKEN'] + '\n')
              env.write('GOOGLE_OAUTH_ACCESS_TOKEN=' + os.environ['GCP_ACCESS_TOKEN'] + '\n')
          PY
      - uses: google-github-actions/setup-gcloud@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install ansible-core==2.19.4
      - run: ansible-galaxy collection install -r infra/ansible/requirements.yml
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate inputs and prepare SSH and secrets
        env:
          DUCKDNS_DOMAIN: ${{ vars.DUCKDNS_DOMAIN }}
          DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          [[ "$IMAGE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          [[ -z "$COMPARISON_COMMIT" || "$COMPARISON_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          test ${#MONGO_ROOT_PASSWORD} -ge 24
          test ${#MONGO_APP_PASSWORD} -ge 24
          test -n "$DUCKDNS_TOKEN" || { echo "::error::DUCKDNS_TOKEN is missing"; exit 1; }
          test -n "$CERTIFICATE_EMAIL" || { echo "::error::CERTIFICATE_EMAIL is missing"; exit 1; }
          python scripts/cloud.py boot
          python scripts/cloud.py dns
      - name: Transfer images; registry credentials stay only on runner
        run: |
          prefix=ghcr.io/pepepedrinho/s8_gcp_iac_cicd_todoapp
          docker pull "$prefix-frontend:$IMAGE_COMMIT"
          docker pull "$prefix-backend:$IMAGE_COMMIT"
          images=("$prefix-frontend:$IMAGE_COMMIT" "$prefix-backend:$IMAGE_COMMIT")
          if [[ -n "$COMPARISON_COMMIT" && "$COMPARISON_COMMIT" != "$IMAGE_COMMIT" ]]; then
            docker pull "$prefix-frontend:$COMPARISON_COMMIT"
            docker pull "$prefix-backend:$COMPARISON_COMMIT"
            images+=("$prefix-frontend:$COMPARISON_COMMIT" "$prefix-backend:$COMPARISON_COMMIT")
          fi
          docker save -o .local/application.tar "${images[@]}"
          gcloud compute scp .local/application.tar todo-app:/tmp/todo-application.tar --zone=us-central1-a --project=triodelicia-mensal4-2026 --tunnel-through-iap --ssh-key-file=.local/ssh/id_ed25519 --ssh-key-expire-after=1h --quiet
          gcloud compute ssh todo-app --zone=us-central1-a --project=triodelicia-mensal4-2026 --tunnel-through-iap --ssh-key-file=.local/ssh/id_ed25519 --ssh-key-expire-after=1h --command='sudo mkdir -p /opt/todo/artifacts && sudo mv /tmp/todo-application.tar /opt/todo/artifacts/application.tar' --quiet
      - name: Configure both hosts and deploy identified images
        run: |
          prefix=ghcr.io/pepepedrinho/s8_gcp_iac_cicd_todoapp
          ansible-playbook -i .local/inventory.yml infra/ansible/site.yml -e @.local/cloud-secrets.json -e @.local/runtime.json -e "todo_version=$IMAGE_COMMIT" -e "todo_frontend_image=$prefix-frontend:$IMAGE_COMMIT" -e "todo_backend_image=$prefix-backend:$IMAGE_COMMIT"
      - name: Verify Ansible idempotency
        run: |
          prefix=ghcr.io/pepepedrinho/s8_gcp_iac_cicd_todoapp
          ansible-playbook -i .local/inventory.yml infra/ansible/site.yml -e @.local/cloud-secrets.json -e @.local/runtime.json -e "todo_version=$IMAGE_COMMIT" -e "todo_frontend_image=$prefix-frontend:$IMAGE_COMMIT" -e "todo_backend_image=$prefix-backend:$IMAGE_COMMIT" | tee .local/ansible-second-run.log
          python -c "import pathlib,re; t=pathlib.Path('.local/ansible-second-run.log').read_text(); r=re.findall(r'changed=(\d+).*unreachable=(\d+).*failed=(\d+)', t); assert len(r)==2 and all(x==('0','0','0') for x in r), r"
      - name: Validate public HTTPS and application readiness
        run: |
          url=$(python -c 'import json; print("https://"+json.load(open(".local/runtime.json"))["todo_domain"])')
          python scripts/smoke.py "$url" --load --evidence docs/evidencias/gcp-smoke.json
          python scripts/cloud.py status
          echo 'Extended persistence, rollback and GCS recovery tests: run Operate with operation=acceptance and the comparison image SHA.' >> "$GITHUB_STEP_SUMMARY"
      - name: Collect bounded diagnostics on failure
        if: failure()
        run: python scripts/cloud.py logs
      - name: Stop both VMs after the unattended deployment tests
        if: always()
        run: python scripts/cloud.py stop
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: |
            docs/evidencias/deploy-context.json
            docs/evidencias/cloud-boot.json
            docs/evidencias/cloud-dns.json
            docs/evidencias/cloud-status.json
            docs/evidencias/cloud-stop.json
            docs/evidencias/cloud-diagnostics.json
            docs/evidencias/gcp-smoke.json
            docs/evidencias/gcp-acceptance.json
          retention-days: 14
